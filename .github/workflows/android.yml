name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Zipalign APK
      run: |
        UNSIGNED_APK=$(find ui/build/outputs/apk/release -type f -name "*-unsigned.apk" -print -quit)
        ZIPALIGN=$(find $ANDROID_HOME/build-tools -type f -name "zipalign" -print -quit)
        $ZIPALIGN -v -p 4 "$UNSIGNED_APK" ui/build/outputs/apk/release/app-release-aligned.apk

    - name: Sign APK
      run: |
        APKSIGNER=$(find $ANDROID_HOME/build-tools -type f -name "apksigner" -print -quit)
        $APKSIGNER sign --ks release.keystore \
          --ks-key-alias android \
          --ks-pass pass:android \
          --out ui/build/outputs/apk/release/app-release-signed.apk \
          ui/build/outputs/apk/release/app-release-aligned.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: wireguard-release-apk
        path: ui/build/outputs/apk/release/app-release-signed.apk
