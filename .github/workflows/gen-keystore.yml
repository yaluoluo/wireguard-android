name: Generate Keystore

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "密钥别名"
        required: true
        default: "android"
      storepass:
        description: "密钥密码"
        required: true
        default: "android"
      dname:
        description: "证书主体"
        required: true
        default: "CN=Android release,O=Android,C=CN"

jobs:
  gen:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -alias "${{ github.event.inputs.alias }}" \
            -storepass "${{ github.event.inputs.storepass }}" \
            -dname "${{ github.event.inputs.dname }}" \
            -noprompt

      - name: Export base64
        run: |
          echo "======== KEYSTORE_BASE64 START ========"
          base64 -w0 release.keystore
          echo ""
          echo "======== KEYSTORE_BASE64 END ========"
          
      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.keystore
